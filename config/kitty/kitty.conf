font_family      JetBrainsMono Nerd Font
font_size        12

# Catppuccin Mocha
include ~/.config/kitty/catppuccin-mocha.conf

cursor_shape      block
cursor_blink_interval 0
# Transparency & Blur
background_opacity 0.5
# background_blur 1          # You can change this (15-50 range is good)
enable_background_blur yes 
# Optional nice additions
dynamic_background_opacity yes
